[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "py-import-checker"
dynamic = ["version"]
description = "Python import health scanner"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Matthieu Graziani", email = "matthieu.graziani@proton.me" }
]
requires-python = ">=3.9"
keywords = [
    "imports",
    "static-analysis",
    "cli",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
py-import-checker = "py_import_checker.cli:main"

[project.urls]
Homepage = "https://github.com/matthieugraziani/py-import-checker"
Repository = "https://github.com/matthieugraziani/py-import-checker"
Issues = "https://github.com/matthieugraziani/py-import-checker/issues"
Changelog = "https://github.com/matthieugraziani/py-import-checker/blob/main/CHANGELOG.md"


[tool.hatch.version]
path = "src/py_import_checker/__init__.py"


[tool.hatch.build.targets.wheel]
packages = ["src/py_import_checker"]

[tool.hatch.build.targets.sdist]
include = [
    "src/py_import_checker",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]


[tool.hatch.envs.default]
dependencies = [
    "pytest>=8",
    "pytest-cov>=6",
    "mypy>=1.10",
    "ruff>=0.9",
]

[tool.hatch.envs.default.scripts]
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
type-check = "mypy src/"
test = "pytest"
all = [
    "format",
    "lint",
    "type-check",
    "test",
]


[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",
]


[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-v --tb=short --cov=py_import_checker --cov-report=term-missing"
python_files = [
    "test_*.py",
    "*_test.py",
]


[tool.coverage.run]
source = [
    "py_import_checker",
]
omit = [
    "tests/*",
    "src/py_import_checker/__main__.py",
]