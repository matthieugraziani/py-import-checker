[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-import-checker"
version = "0.1.0"
description = "Fast, zero-dependency Python import health scanner"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "matthieugraziani" }]
requires-python = ">=3.9"
keywords = ["imports", "linting", "static-analysis", "debugging", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
py-import-checker = "py_import_checker.cli:main"

[project.urls]
Homepage = "https://github.com/matthieugraziani/py-import-checker"
Repository = "https://github.com/matthieugraziani/py-import-checker"
Issues = "https://github.com/matthieugraziani/py-import-checker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/py_import_checker"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
