name: Publish to PyPI

on:
  release:
    types: [published] # Le build se déclenche automatiquement à chaque nouvelle "Release" sur GitHub

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/py-import-checker
    permissions:
      id-token: write  # Crucial pour le Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up hatch
        uses: pypa/hatch-install@v1
      - name: Build
        run: hatch build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1